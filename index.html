<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<title>HAMEE HUB</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: cổng công khai dạng cột đơn mobile-first + khu Admin có tab bar đáy cho điện thoại */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --fg:#14202b; --muted:#5b6a78; --line:#dde3e9;
  --steel:#1e9bd7; --steel-2:#1565d8; --sky:#e3f4fd; --sky-2:#b9e3f8; --ink:#0d2a4a; --copper:#d7191f; --copper-soft:#fde3e3;
  --ok:#1f8a5b; --ok-soft:#dff3ea; --warn:#b7791f; --warn-soft:#fbefd6; --bad:#c0392b; --bad-soft:#f9e0dd;
  --f-display:"Barlow Condensed","Arial Narrow",sans-serif;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e161e; --surface:#16212c; --fg:#e6edf3; --muted:#93a3b2; --line:#26343f;
  --steel:#0f5f8f; --steel-2:#1a6fd0; --sky:#12324a; --sky-2:#174563; --ink:#e6f4fc; --copper:#ff5a5f; --copper-soft:#3d1719;
  --ok:#4cc38a; --ok-soft:#173327; --warn:#e2b04a; --warn-soft:#3a2e14; --bad:#ef6b5b; --bad-soft:#3d1c18; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e161e; --surface:#16212c; --fg:#e6edf3; --muted:#93a3b2; --line:#26343f;
  --steel:#0f5f8f; --steel-2:#1a6fd0; --sky:#12324a; --sky-2:#174563; --ink:#e6f4fc; --copper:#ff5a5f; --copper-soft:#3d1719;
  --ok:#4cc38a; --ok-soft:#173327; --warn:#e2b04a; --warn-soft:#3a2e14; --bad:#ef6b5b; --bad-soft:#3d1c18; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:15px;line-height:1.55;margin:0}
a{color:var(--copper)}
h1,h2,h3{font-family:var(--f-display);letter-spacing:.01em;text-wrap:balance;margin:0;line-height:1.1}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--copper);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--copper)}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--steel);color:#fff}
.top .wrap{display:flex;align-items:center;gap:12px;min-height:56px}
.logo{display:flex;align-items:center;gap:8px;text-decoration:none;color:#fff;font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:.04em}
.logo .lg{width:38px;height:38px;flex:none}
.logo i{width:26px;height:26px;border-radius:6px;background:var(--copper);display:grid;place-items:center;font-style:normal;font-size:15px}
.nav{display:flex;gap:4px;margin-left:auto;overflow-x:auto;scrollbar-width:none}
.nav a{color:#eaf6fd;text-decoration:none;padding:8px 10px;border-radius:8px;white-space:nowrap;font-size:14px}
.nav a.on,.nav a:hover{color:#fff;background:rgba(255,255,255,.1)}
.nav a.adm{background:var(--copper);color:#fff}
@media (max-width:760px){.nav{display:none}.menu-btn{display:block!important}}
.menu-btn{display:none;margin-left:auto;background:none;border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:8px;padding:6px 10px}
.drawer{background:var(--steel);padding:8px 16px 14px;display:grid;gap:2px}
.drawer a{color:#e6edf3;text-decoration:none;padding:10px 4px;border-bottom:1px solid rgba(255,255,255,.08)}

/* hero */
.hero{background:linear-gradient(180deg,var(--sky) 0%,var(--sky-2) 100%);color:var(--ink);padding-block:40px 48px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:0;background-image:repeating-linear-gradient(90deg,rgba(21,101,216,.06) 0 1px,transparent 1px 48px),repeating-linear-gradient(0deg,rgba(21,101,216,.06) 0 1px,transparent 1px 48px);pointer-events:none}
.hero .wrap{position:relative;z-index:1}
.hero h1{font-size:clamp(34px,7vw,60px);font-weight:800;text-transform:uppercase;margin-block:10px 14px}
.hero h1 span{color:var(--copper)}
.hero p{max-width:60ch;color:var(--ink);opacity:.85;margin:0 0 22px}
.btns{display:flex;flex-wrap:wrap;gap:10px}
.btn{border:0;border-radius:8px;padding:11px 18px;font-weight:600;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn.pri{background:var(--copper);color:#fff}
.btn.ghost{background:transparent;color:inherit;border:1px solid currentColor}
.btn.sm{padding:7px 12px;font-size:13px}
.btn.ok{background:var(--ok);color:#fff}.btn.bad{background:var(--bad-soft);color:var(--bad)}
.btn.line{background:var(--surface);border:1px solid var(--line);color:var(--fg)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--sky-2);border-radius:var(--r);overflow:hidden;margin-top:30px}
.stats div{background:var(--surface);padding:14px}
.stats b{display:block;font-family:var(--f-display);font-size:30px;color:var(--steel-2)}
.stats small{color:var(--muted);font-size:12px}
@media (max-width:640px){.stats{grid-template-columns:repeat(2,1fr)}}

section.blk{padding-block:36px}
.sec-h{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.sec-h h2{font-size:30px;text-transform:uppercase}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0}

/* sectors */
.sectors{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.sector{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;text-align:left;color:var(--fg)}
.sector:hover{border-color:var(--copper)}
.sector code{font-family:var(--f-mono);font-size:11px;color:var(--copper);background:var(--copper-soft);border-radius:4px;padding:2px 5px;flex:none}
.sector span{font-size:13.5px;font-weight:600;line-height:1.3}
.sector small{display:block;color:var(--muted);font-weight:400;font-size:12px;margin-top:2px}

.news-item{display:flex;gap:12px}
.date{flex:none;width:52px;text-align:center;border:1px solid var(--line);border-radius:8px;padding:6px 0;background:var(--bg)}
.date b{display:block;font-family:var(--f-display);font-size:24px;line-height:1}
.date small{font-size:11px;color:var(--muted)}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--copper-soft);color:var(--copper)}
.pill{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:99px}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.n{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.avatar{width:42px;height:42px;border-radius:8px;background:var(--steel-2);color:#fff;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:17px;flex:none}
.row{display:flex;gap:10px;align-items:center;min-width:0}
.row>div{min-width:0}
.ellip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.inp{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.filters .inp{flex:1 1 200px;width:auto}
.f{display:grid;gap:4px;font-size:13px;font-weight:600}
form.stack{display:grid;gap:12px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:13px;color:var(--fg)}
.chip.on{background:var(--steel-2);color:#fff;border-color:var(--steel-2)}
.lang{background:transparent;border:1px solid rgba(255,255,255,.5);color:#fff;border-radius:8px;padding:6px 9px;font-size:13px;font-weight:600}
.lang.m{display:none}@media (max-width:760px){.lang.m{display:block}.menu-btn{margin-left:8px!important}.top .lang.m{margin-left:auto}}
.newsc{padding:0;overflow:hidden;cursor:pointer}.newsc .thumb{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;max-width:100%;background:var(--bg)}
.mapbox{height:min(70vh,560px);border-radius:var(--r);border:1px solid var(--line);margin-bottom:8px;z-index:0}
textarea.inp{resize:vertical}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:24px}.duo>div{min-width:0}@media (max-width:760px){.duo{grid-template-columns:1fr}}
.hotrow{display:grid;grid-auto-flow:column;grid-auto-columns:min(88%,420px);gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px}.hotcard{padding:0;overflow:hidden;scroll-snap-align:start}.hotcard img,.hotph{width:100%;max-width:100%;aspect-ratio:16/9;object-fit:cover;display:block;cursor:pointer}.hotph{display:grid;place-items:center;padding:16px;text-align:center;font-family:var(--f-display);font-size:24px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--steel-2),var(--copper))}
.evcard{padding:0;overflow:hidden}.evcard .poster{width:100%;max-width:100%;aspect-ratio:16/9;object-fit:cover;display:block;cursor:pointer;background:var(--bg)}
.feeline{font-size:13px;margin-top:4px;padding:4px 8px;border-radius:6px;background:var(--copper-soft);display:inline-block}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}@media (min-width:640px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{display:grid;gap:2px;justify-items:start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 12px;color:var(--fg);font:inherit;cursor:pointer}.tile:active{transform:scale(.98)}
.tile .tic{font-size:24px;line-height:1;margin-bottom:6px}.tile b{font-size:15px}.tile small{color:var(--muted);font-size:12.5px}
.acctabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}.acctabs button{flex:none}
.syncb{font-size:11px;padding:3px 8px;border-radius:99px;background:rgba(255,255,255,.18);color:#fff;white-space:nowrap}.syncb.ok{background:rgba(31,138,91,.85)}.syncb.bad{background:var(--bad)}
.rowbtn{display:flex;gap:10px;align-items:center;width:100%;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:var(--r);padding:12px;font:inherit;cursor:pointer}
.li .rowbtn{border:0;padding:0;background:none}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}.tbl{border-collapse:collapse;font-size:12.5px;min-width:100%}.tbl th,.tbl td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;max-width:260px;overflow:hidden;text-overflow:ellipsis}.tbl th{background:var(--bg);font-weight:600}
.adm-top h1{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.clip3{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.gtseg button{font-weight:700}
fieldset.card{margin:0;min-width:0}legend{font-family:var(--f-display);font-size:20px;font-weight:700;padding:0 6px;color:var(--steel-2)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media (max-width:560px){.two{grid-template-columns:1fr}}
.radios,.checks{display:flex;flex-wrap:wrap;gap:6px 14px;font-weight:400;margin-top:4px}.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.rd{display:flex;gap:8px;align-items:center;font-size:14px;font-weight:400;cursor:pointer}.rd input{width:18px;height:18px;accent-color:var(--steel-2);flex:none}
.kv{display:grid;grid-template-columns:120px 1fr;gap:8px;font-size:13.5px;padding:4px 0;border-bottom:1px solid var(--line)}.kv span{color:var(--muted)}.kv b{font-weight:500;min-width:0;overflow-wrap:anywhere}
.foot{background:var(--steel-2);color:#dcebfb;padding-block:28px;font-size:13px;margin-top:20px}
.foot b{color:#fff}
.empty{padding:24px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;z-index:99;max-width:calc(100% - 32px)}

/* ========== ADMIN ========== */
.adm-top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--steel);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:10px}
.adm-top h1{font-size:22px;flex:1}
.adm-main{max-width:720px;margin:0 auto;padding:14px 16px calc(96px + env(safe-area-inset-bottom,0px))}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar button{background:none;border:0;padding:8px 0 9px;min-width:0;display:grid;justify-items:center;gap:2px;font-size:11px;color:var(--muted);position:relative}
.tabbar button svg{width:22px;height:22px}
.tabbar button.on{color:var(--copper)}
.badge{position:absolute;top:4px;left:calc(50% + 6px);background:var(--bad);color:#fff;border-radius:99px;font-size:10px;min-width:17px;padding:0 4px;line-height:17px}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.kpi small{color:var(--muted);font-size:12px}
.kpi b{display:block;font-family:var(--f-display);font-size:30px;line-height:1.1}
.kpi em{font-style:normal;font-size:12px;color:var(--ok)}
.task{display:flex;align-items:center;gap:10px;padding:12px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:var(--r);text-align:left;width:100%;color:var(--fg)}
.task.bad{border-left-color:var(--bad)}.task.ok{border-left-color:var(--ok)}
.task b{font-family:var(--f-display);font-size:26px;min-width:34px}
.list{display:grid;gap:8px}
.li{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:8px}
.li .acts{display:flex;gap:6px;flex-wrap:wrap}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;margin-bottom:12px;overflow-x:auto}
.seg button{flex:1;border:0;background:none;padding:8px 10px;border-radius:8px;font-size:13px;white-space:nowrap;color:var(--muted)}
.seg button.on{background:var(--steel-2);color:#fff}
.fab{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:31;width:54px;height:54px;border-radius:16px;border:0;background:var(--copper);color:#fff;font-size:28px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:88vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.sheet h3{font-size:24px;margin-bottom:12px}
.bar{height:8px;background:var(--bg);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--copper)}
.sbars{display:grid;gap:7px}
.sbars .r{display:grid;grid-template-columns:1fr 34px;gap:8px;align-items:center;font-size:12.5px}
.login{max-width:360px;margin:12vh auto 0;padding-inline:16px}
.pin{font-family:var(--f-mono);font-size:28px;letter-spacing:.5em;text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

  btn.disabled=true;btn.textContent="Đang kiểm tra…";
  let R0;try{R0=await(await fetch((CRM_URL||JOIN_URL)+"?action=otp_verify&email="+encodeURIComponent(em)+"&code="+code)).json();if(!R0.ok)throw R0.error}catch(x){btn.disabled=false;btn.textContent="Xác nhận";return err(x==="qua_nhieu"?"Nhập sai quá nhiều lần. Vui lòng gửi lại mã sau ít phút.":"Mã không đúng hoặc đã hết hạn (10 phút).")}

const GT_SCRIPT="https://script.google.com/macros/s/AKfycbw72uZrrFxoprUDCSP66DlbqG2m3e9ND5wFRsFSlSG8MjIw_ZNkHOxCQtuu-7S3UYZNfw/exec";
const GT_LV=["Cơ khí - điện - năng lượng","Tự động hoá - công nghệ số","Vận tải - logistics","Xây dựng","Cao su nhựa","Chế biến gỗ","Nông lâm thuỷ hải sản","Truyền thông - nghiên cứu"];
const GT={tab:"mua",nhom:-1,q:"",rows:null,loading:false,saved:[]};try{GT.saved=JSON.parse(localStorage.getItem("gt_saved"))||[]}catch(e){}
const gtLists=loai=>loai==="ban"?SECTORS.map(s=>s[1]):GT_LV;
function gtNhom(v,loai){const LV=gtLists(loai);v=(v||"").trim();const n=parseInt(v.replace(/[()]/g,""));if(n>=1&&n<=LV.length)return n-1;const i=LV.findIndex(x=>x.toLowerCase()===v.toLowerCase());return i>=0?i:LV.findIndex(x=>v&&x.toLowerCase().includes(v.toLowerCase()))}
function gtMember(sdt,email){const ph=(sdt||"").replace(/\D/g,"").slice(-9),em=(email||"").toLowerCase();if(acct())return DB.members.find(x=>x.id===ME);return DB.members.find(x=>x.status==="active"&&((ph.length===9&&[x.phone,x.mobile].some(p=>(p||"").replace(/\D/g,"").slice(-9)===ph))||(em&&(x.email||"").toLowerCase()===em)))}
function gtTime(s){const m=/(\d{1,2})\/(\d{1,2})\/(\d{4})/.exec(s||"");return m?new Date(+m[3],m[2]-1,+m[1]).getTime():0}
function gtCSV(txt){const rows=[];let r=[],f="",q=false;for(let i=0;i<txt.length;i++){const c=txt[i];if(q){if(c=='"'){if(txt[i+1]=='"'){f+='"';i++}else q=false}else f+=c}else if(c=='"')q=true;else if(c==","){r.push(f);f=""}else if(c=="\n"||c=="\r"){if(c=="\r"&&txt[i+1]=="\n")i++;r.push(f);rows.push(r);r=[];f=""}else f+=c}if(f||r.length){r.push(f);rows.push(r)}const h=(rows.shift()||[]).map(x=>x.trim().toLowerCase());return rows.filter(r=>r.some(x=>x.trim())).map(r=>Object.fromEntries(h.map((k,i)=>[k,(r[i]||"").trim()])))}
function gtLocal(){return DB.trades.filter(x=>x.status==="live"&&x.type!=="Hợp tác").map(x=>({loai:x.type==="Cần mua"?"mua":"ban",tieu_de:x.title,mo_ta:x.desc||"",cong_ty:x.org,ho_ten:x.name||"",khu_vuc:x.area||"",nganh:"",t:d(x.date).getTime(),trang_thai:"duyet"}))}
function gtPosts(){const rows=GT.rows||gtLocal();return rows.map(x=>({...x,loai:(x.loai||"").toLowerCase().replace("á","a")})).filter(x=>(x.loai==="mua"||x.loai==="ban")&&(!("trang_thai" in x)||/^duy[eệ]t$/i.test(x.trang_thai))).map(x=>({...x,t:x.t||gtTime(x.ngay_dang),nhom:gtNhom(x.nganh||x.linh_vuc,x.loai),id:(x.loai+x.cong_ty+x.tieu_de).replace(/\s/g,"").slice(0,80)}))}
async function gtLoad(){if(GT.rows||GT.loading)return;GT.loading=true;try{const r=await fetch(GT_CSV+"&t="+Date.now());if(!r.ok)throw 0;GT.rows=gtCSV(await r.text());try{localStorage.setItem("gt_cache",JSON.stringify(GT.rows))}catch(e){}}catch(e){try{GT.rows=JSON.parse(localStorage.getItem("gt_cache"))}catch(err){}}GT.loading=false;if(route==="trade"||route==="home")render()}
const gtAgo=t=>{if(!t)return"";const m=(Date.now()-t)/6e4;return m<60?Math.max(1,m|0)+" phút trước":m<1440?(m/60|0)+" giờ trước":(m/1440|0)+" ngày trước"};
function gtCard(p,full){const sv=GT.saved.includes(p.id),pid=esc(p.id);return `<div class="card gtc"><div class="row" style="align-items:flex-start"><div class="avatar" style="border-radius:50%">${p.logo?`<img src="${esc(p.logo)}" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`:esc((p.ho_ten||p.cong_ty||"?").trim().split(" ").pop()[0]||"?")}</div><div style="flex:1;min-width:0"><b>${esc(p.ho_ten||p.cong_ty)}</b><div class="muted ellip" style="font-size:13px">${esc(p.cong_ty)}</div></div><span class="pill ${p.loai==="ban"?"ok":"warn"}">${p.loai==="ban"?"CẦN BÁN":"CẦN MUA"}</span></div>
 <div style="font-weight:700;font-size:16px;margin:10px 0 4px">${esc(p.tieu_de)}</div><div class="${full?"":"clip3"}" style="font-size:14px">${esc(p.mo_ta)}</div>
 ${full&&(p.san_pham||p.website)?`<div class="list" style="font-size:13.5px;margin-top:8px">${p.san_pham?`<div><span class="muted">Sản phẩm:</span> ${esc(p.san_pham)}</div>`:""}${p.website?`<div><span class="muted">Website:</span> <a href="${esc(/^https?:/.test(p.website)?p.website:"https://"+p.website)}" target="_blank" rel="noopener">${esc(p.website.replace(/^https?:\/\//,""))}</a></div>`:""}</div>`:""}
 <div class="muted" style="font-size:12.5px;display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:8px">${p.nhom>=0?`<span>🏭 ${esc(gtLists(p.loai)[p.nhom])}</span>`:""}${p.loai==="ban"?`<span class="pill ok" style="font-size:11px">Hội viên HAMEE</span>`:""}${p.khu_vuc?`<span>📍 ${esc(p.khu_vuc)}</span>`:""}${p.t?`<span>🕒 ${gtAgo(p.t)}</span>`:""}</div>
 <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:10px"><button class="btn line sm" data-gtc="${pid}">🤝 Kết nối</button><button class="btn line sm" data-gts="${pid}">${sv?"🔖 Đã lưu":"🏷️ Lưu"}</button>${full?"":`<button class="btn sm" style="background:none;color:var(--steel-2);margin-left:auto" data-gtd="${pid}">Xem chi tiết ›</button>`}</div></div>`}
function gtMe(){try{return JSON.parse(localStorage.getItem("gt_me"))||{}}catch(e){return{}}}
function gtField(id,lab,ph,v,type,area){return `<label class="f">${lab}${area?`<textarea class="inp" id="${id}" rows="3" placeholder="${ph}">${esc(v)}</textarea>`:`<input class="inp" id="${id}" type="${type||"text"}" placeholder="${ph}" value="${esc(v)}">`}</label>`}
function gtLvSel(id,v,lab){return `<label class="f">${lab}<select class="inp" id="${id}"><option value="">— Chọn ngành nghề —</option>${GT_LV.map((x,i)=>`<option value="${i}" ${v===String(i)?"selected":""}>(${i+1}) ${esc(x)}</option>`).join("")}</select></label>`}
function gtLvSel2(id,loai){const LV=gtLists(loai);return `<label class="f">${loai==="ban"?"Nhóm ngành HAMEE *":"Ngành nghề * (để phân loại nhu cầu)"}<select class="inp" id="${id}"><option value="">— Chọn —</option>${LV.map((x,i)=>`<option value="${i}">(${i+1}) ${esc(x)}</option>`).join("")}</select></label>`}
async function gtSend(data){if(!GT_SCRIPT)return;await fetch(GT_SCRIPT,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain"},body:JSON.stringify(data)})}
function gtDefaults(){const m=gtMe(),me=acct()&&DB.members.find(x=>x.id===ME);return {ten:m.ten||me?.rep||"",cty:m.cty||me?.name||"",sdt:m.sdt||"",email:m.email||me?.email||"",web:m.web||me?.web||"",lv:m.lv||"",sp:m.sp||me?.products||""}}
function gtDetail(id){const p=gtPosts().find(x=>x.id===id);if(!p)return;sheet(`${gtCard(p,true)}<button class="btn line" id="gdc" style="width:100%;justify-content:center;margin-top:8px">Đóng</button>`,(bg,close)=>{bg.querySelector("#gdc").onclick=close;gtBind(bg,close)})}
function gtConnect(id){const p=gtPosts().find(x=>x.id===id),m=gtDefaults();
 sheet(`<h3>Kết nối giao thương</h3><p class="muted" style="margin-top:-6px;font-size:13.5px">Ban quản trị HAMEE sẽ liên hệ và kết nối anh/chị với <b>${esc(p.cong_ty)}</b> về: “${esc(p.tieu_de)}”</p><form class="stack" id="gcf">${gtField("cN","Họ tên *","Nguyễn Văn A",m.ten)}${gtField("cC","Doanh nghiệp *","Công ty…",m.cty)}${gtField("cP","Số điện thoại / Zalo *","09xxxxxxxx",m.sdt,"tel")}${gtField("cE","Email","email@congty.vn",m.email,"email")}${gtField("cW","Website công ty","congty.vn",m.web)}${gtLvSel("cL",m.lv,"Ngành nghề doanh nghiệp *")}${gtField("cS","Sản phẩm / dịch vụ","VD: Khuôn mẫu, chi tiết máy…",m.sp,0,1)}${gtField("cM","Lời nhắn","Nội dung muốn trao đổi…","",0,1)}<p id="gce" class="muted" style="color:var(--bad);margin:0" hidden>Nhập đủ các mục có dấu * và số điện thoại đúng (10–11 số, bắt đầu bằng 0).</p><button class="btn pri" style="justify-content:center">Gửi yêu cầu kết nối</button></form>`,(bg,close)=>{bg.querySelector("#gcf").onsubmit=async e=>{e.preventDefault();const v=s=>bg.querySelector(s).value.trim();const dd={ten:v("#cN"),cty:v("#cC"),sdt:v("#cP").replace(/\s/g,""),email:v("#cE"),web:v("#cW"),lv:v("#cL"),sp:v("#cS")};
  if(!dd.ten||!dd.cty||!/^0\d{9,10}$/.test(dd.sdt)||dd.lv===""){bg.querySelector("#gce").hidden=false;return}
  try{localStorage.setItem("gt_me",JSON.stringify(dd))}catch(err){}try{await gtSend({action:"ket_noi",...dd,lv:GT_LV[+dd.lv],loi_nhan:v("#cM"),tin:p.tieu_de,loai:p.loai,cong_ty_dang:p.cong_ty,nguoi_dang:p.ho_ten,sdt_nguoi_dang:p.sdt||""})}catch(err){}
  close();toast("Đã gửi. HAMEE sẽ liên hệ anh/chị sớm")}})}
function gtPost(){const m=gtDefaults();let loai=GT.tab==="ban"?"ban":"mua";
 sheet(`<h3>Gửi nhu cầu mua / bán</h3><p class="muted" style="margin-top:-6px;font-size:13.5px">Tin sẽ hiển thị sau khi Ban quản trị duyệt.</p><form class="stack" id="gpf"><div class="f">Loại nhu cầu *<div class="seg" id="pT" style="margin:4px 0 0"><button type="button" data-v="mua" class="${loai==="mua"?"on":""}">Cần mua</button><button type="button" data-v="ban" class="${loai==="ban"?"on":""}">Cần bán</button></div></div>
 ${gtField("pTi","Tiêu đề *","VD: Cần mua thép tấm SS400 số lượng lớn","")}${gtField("pD","Mô tả chi tiết","Số lượng, tiêu chuẩn, thời gian…","",0,1)}${gtField("pK","Khu vực","VD: Phường Thới An, TP.HCM","")}${gtField("pN","Họ tên *","",m.ten)}${gtField("pC","Doanh nghiệp *","",m.cty)}${gtField("pP","Số điện thoại / Zalo *","",m.sdt,"tel")}${gtField("pE","Email","",m.email,"email")}${gtField("pW","Website công ty","congty.vn",m.web)}<div id="pLbox">${gtLvSel2("pL",loai)}</div><div id="pMem" class="card" style="padding:10px;font-size:13.5px" ${loai==="ban"?"":"hidden"}>🔒 Đăng tin bán với tư cách hội viên: <b>${acct()?esc(DB.members.find(x=>x.id===ME).name):""}</b></div>${gtField("pS","Sản phẩm / dịch vụ","VD: Tủ điện, máng cáp…",m.sp,0,1)}
 <p id="gpe" class="muted" style="color:var(--bad);margin:0" hidden>Nhập đủ các mục có dấu * và số điện thoại đúng.</p><button class="btn pri" style="justify-content:center">Gửi duyệt</button></form>`,(bg,close)=>{bg.querySelectorAll("#pT button").forEach(b=>b.onclick=()=>{if(b.dataset.v==="ban"&&!acct()){close();return requireMember("Nhu cầu bán chỉ dành cho doanh nghiệp hội viên.",()=>{GT.tab="ban";gtPost()})}loai=b.dataset.v;bg.querySelectorAll("#pT button").forEach(x=>x.classList.toggle("on",x===b));bg.querySelector("#pLbox").innerHTML=gtLvSel2("pL",loai);bg.querySelector("#pMem").hidden=loai!=="ban"});
  bg.querySelector("#gpf").onsubmit=async e=>{e.preventDefault();const v=s=>bg.querySelector(s).value.trim();const dd={ten:v("#pN"),cty:v("#pC"),sdt:v("#pP").replace(/\s/g,""),email:v("#pE"),web:v("#pW"),lv:v("#pL"),sp:v("#pS")};
  if(!v("#pTi")||!dd.ten||!dd.cty||!/^0\d{9,10}$/.test(dd.sdt)||dd.lv===""){const er=bg.querySelector("#gpe");er.textContent="Nhập đủ các mục có dấu * và số điện thoại đúng.";er.hidden=false;return}
  let mem=null;if(loai==="ban"){mem=acct()?DB.members.find(x=>x.id===ME):null;if(!mem){const er=bg.querySelector("#gpe");er.innerHTML=`Số điện thoại / email này chưa có trong danh sách hội viên HAMEE nên chưa đăng được nhu cầu bán. <a href="#account">Đăng nhập hội viên</a> hoặc <a href="#join">đăng ký gia nhập HAMEE</a>.`;er.hidden=false;return}dd.cty=mem.name}
  try{localStorage.setItem("gt_me",JSON.stringify(dd))}catch(err){}
  DB.trades.unshift({id:nid(),mid:(mem&&mem.id)||ME||null,type:loai==="mua"?"Cần mua":"Cung cấp",title:v("#pTi"),desc:v("#pD"),area:v("#pK"),name:dd.ten,org:dd.cty,sector:"00",date:isoL(),status:"pending"});save();
  try{const LV=gtLists(loai);await gtSend({action:"dang_tin",loai,tieu_de:v("#pTi"),mo_ta:(loai==="ban"?"[Hội viên HAMEE] ":"")+v("#pD"),nganh:LV[+dd.lv],khu_vuc:v("#pK"),...dd,lv:LV[+dd.lv]})}catch(err){}
  close();toast("Đã gửi. Tin sẽ hiển thị sau khi được duyệt");render()}})}
function gtBind(root,close){root.querySelectorAll("[data-gtc]").forEach(b=>b.onclick=()=>{close&&close();gtConnect(b.dataset.gtc)});
 root.querySelectorAll("[data-gts]").forEach(b=>b.onclick=()=>{const id=b.dataset.gts;GT.saved=GT.saved.includes(id)?GT.saved.filter(x=>x!==id):[...GT.saved,id];try{localStorage.setItem("gt_saved",JSON.stringify(GT.saved))}catch(e){}toast(GT.saved.includes(id)?"Đã lưu":"Đã bỏ lưu");close&&close();render()});
 root.querySelectorAll("[data-gtd]").forEach(b=>b.onclick=()=>gtDetail(b.dataset.gtd))}

function renderPublic(){
 const members=DB.members.filter(m=>m.status==="active");
 const upcoming=DB.events.filter(e=>e.pub!==false&&d(e.date)>=today).sort((a,b)=>d(a.date)-d(b.date));
 let body="";
 if(route==="home"){
  const newM=(members.some(m=>m.joined)?members.filter(m=>m.joined).sort((a,b)=>d(b.joined)-d(a.joined)):members.filter(m=>m.id>=1000).sort((a,b)=>a.id-b.id)).slice(0,4);
  const bdIn=k=>{const x=new Date(today);x.setDate(x.getDate()+k);return mmdd(x)};const bdSoon=[];for(let k=1;k<=30;k++)members.filter(m=>m.bday===bdIn(k)).forEach(m=>bdSoon.push([m,k]));
  const bd=members.filter(m=>m.bday===mmdd(today));
  const fd=members.filter(m=>m.founded&&m.founded.slice(5,7)===mmdd(today).slice(0,2)).sort((a,b)=>a.founded.slice(8)-b.founded.slice(8));
  body=`<section class="hero"><div class="wrap">
   <div class="eyebrow">${esc(SITE().heroEyebrow)}</div>
   <h1>${esc(SITE().heroTitle1)}<br><span>${esc(SITE().heroTitle2)}</span></h1>
   <p>${esc(SITE().heroText)}</p>
   <div class="btns"><a class="btn pri" href="#join">Đăng ký hội viên</a><a class="btn ghost" href="#members">Tìm doanh nghiệp</a></div>
   <div class="stats">${SITE().stats.map(s=>`<div><b class="num">${esc(s[0])}</b><small>${esc(s[1])}</small></div>`).join("")}</div>
  </div></section>
  ${(()=>{const hot=upcoming.filter(e=>e.hot);return hot.length?`<section class="blk" style="padding-bottom:0"><div class="wrap"><div class="sec-h"><div><div class="eyebrow">Đừng bỏ lỡ</div><h2>Sự kiện nổi bật</h2></div><a href="#events">Tất cả sự kiện →</a></div><div class="hotrow">${hot.map(e=>`<div class="card hotcard">${e.poster?`<img src="${esc(imgUrl(e.poster))}" alt="Poster ${esc(e.title)}" data-evd="${e.id}" onerror="this.outerHTML='<div class=hotph data-evd=${e.id}>${esc(e.title)}</div>'">`:`<div class="hotph" data-evd="${e.id}">${esc(e.title)}</div>`}<div style="padding:12px 14px;display:grid;gap:4px"><span class="tag" style="justify-self:start">🔥 Hot Event · ${fmt(e.date)}</span><b style="font-size:16px;cursor:pointer" data-evd="${e.id}">${esc(e.title)}</b><span class="muted" style="font-size:13px">📍 ${esc(e.place)}</span><span class="feeline">💰 Phí tham dự: <b>${evPriceTxt(e,true)}</b></span><button class="btn pri sm" data-reg="${e.id}" style="justify-self:start;margin-top:4px">Đăng ký tham dự</button></div></div>`).join("")}</div></div></section>`:""})()}
  <section class="blk"><div class="wrap"><div class="sec-h"><div><div class="eyebrow">Lĩnh vực hoạt động</div><h2>14 nhóm ngành</h2></div><span class="muted" style="font-size:13px">Chạm để xem doanh nghiệp trong nhóm</span></div>
   <div class="sectors">${SECTORS.map(s=>{const n=members.filter(m=>inSec(m,s[0])).length;return `<button class="sector" data-sector="${s[0]}"><code>${s[0]}</code><span>${s[1]}<small>${s[2]} · ${n} DN</small></span></button>`}).join("")}</div></div></section>
  <section class="blk" style="padding-top:0"><div class="wrap"><div class="sec-h"><div><div class="eyebrow">Đừng bỏ lỡ</div><h2>Sự kiện sắp diễn ra</h2></div><a href="#events">Xem tất cả →</a></div>
   <div class="grid g2">${upcoming.slice(0,4).map(eventCard).join("")}</div></div></section>
  <section class="blk" style="padding-top:0"><div class="wrap"><div class="sec-h"><div><div class="eyebrow">Cung – cầu mới nhất</div><h2>Nhu cầu Mua / Bán</h2></div><a href="#trade">Xem tất cả →</a></div>
   <div class="grid g2">${gtPosts().sort((a,b)=>b.t-a.t).slice(0,4).map(p=>gtCard(p)).join("")||`<div class="empty">Đang tải tin giao thương…</div>`}</div></div></section>
  <section class="blk" style="padding-top:0"><div class="wrap duo">

const YEARS=()=>{const s=new Set([DB.settings.year,today.getFullYear(),...DB.fees.map(f=>+f.year)]);return [...s].sort((a,b)=>b-a)};
function feeRecs(m,y){return DB.fees.filter(f=>f.mid===m.id&&+f.year===+y)}
function feeStat(m,y=DB.settings.year){
 if(m.feeExempt)return {k:"exempt",l:"Miễn phí",c:"n",sum:0};
 const sum=feeRecs(m,y).reduce((s,f)=>s+(+f.amount||0),0),need=+DB.settings.feeAmount||0,has=feeRecs(m,y).length>0;
 if(has&&(need===0||sum>=need))return {k:"paid",l:"Đã đóng",c:"ok",sum};
 if(has)return {k:"partial",l:"Đóng thiếu",c:"warn",sum};
 const overdue=+y<today.getFullYear()||(+y===today.getFullYear()&&DB.settings.feeDue&&today>d(DB.settings.feeDue));
 return overdue?{k:"overdue",l:"Quá hạn",c:"bad",sum:0}:{k:"due",l:"Chưa đóng",c:"warn",sum:0}}
function partsOf(m){const out=[];DB.events.forEach(e=>e.regs.forEach(r=>{if(r.mid===m.id)out.push({e,r})}));return out.sort((a,b)=>d(b.e.date)-d(a.e.date))}
function attended12(m){const lim=new Date(today);lim.setFullYear(lim.getFullYear()-1);return partsOf(m).filter(p=>p.r.checked&&d(p.e.date)>=lim).length}
function caresOf(m){return DB.care.filter(c=>c.mid===m.id).sort((a,b)=>d(b.date)-d(a.date))}
function dueCare(){return DB.care.filter(c=>c.next&&!c.done&&d(c.next)<=today)}
function mById(id){return DB.members.find(x=>x.id==id)}

function renderAdmin(){location.href="admin/"}
/*==ADMIN-END==*/
async function loadPublic(){if(!CRM_URL)return;try{const j=await(await fetch(CRM_URL+"?action=public&t="+Date.now())).json();if(!j||j.error)return;
 if(j.events&&j.events.length){const loc=Object.fromEntries(DB.events.map(e=>[String(e.id),e]));DB.events=j.events.map(e=>Object.assign(e,{regs:(loc[String(e.id)]||{}).regs||[]}))}
 if(j.members&&j.members.length){const keep=Object.fromEntries(DB.members.map(m=>[m.id,m]));DB.members=j.members.map(m=>Object.assign({status:"active"},keep[m.id]&&ME===m.id?keep[m.id]:{},m))}
 if(j.news&&j.news.length)DB.news=j.news;if(j.site&&j.site[0])DB.site=j.site[0];crmInit();if(!route.startsWith("admin"))render()}catch(e){}}
render();loadPublic().then(loadMe);
